# Optional: encrypted DNS via systemd-resolved (from the old ansible extra.yml).
# Install with:  ./bootstrap.sh dns
#
# Network/VPN-provided DNS servers still take precedence for their own
# domains. After enabling, connect your VPN and check that its internal
# names still resolve with `resolvectl query <internal-host>`.
# If they don't, remove this file and run: sudo systemctl restart systemd-resolved
#
# Don't combine this with Omarchy's Setup > Network > DNS: that writes a
# NetworkManager global DNS override, which also overrides the VPN's DNS.

[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net
FallbackDNS=1.1.1.1#cloudflare-dns.com 8.8.8.8#dns.google 2606:4700:4700::1111#cloudflare-dns.com 2001:4860:4860::8888#dns.google
DNSOverTLS=opportunistic
