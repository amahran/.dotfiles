# Don't suspend on lid close while on AC power.
#
# Docked with the lid closed, Omarchy's lock screen turns the external monitor
# off after 5 s by disabling its output. logind then no longer counts it as an
# external display, so the lid rule applies and the laptop suspends, which
# drops the work VPN. On battery, closing the lid still suspends.
[Login]
HandleLidSwitchExternalPower=ignore
