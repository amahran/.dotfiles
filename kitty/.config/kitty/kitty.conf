# Shell: kitty starts $SHELL (zsh, set by bootstrap.sh), so no `shell` line.

# command: kitten themes
# BEGIN_KITTY_THEME
# Rosé Pine
include current-theme.conf
# END_KITTY_THEME
# To follow Omarchy's theme switcher instead, replace the include above with:
# include ~/.local/state/omarchy/current/theme/kitty.conf

background_opacity 1

font_size 12.0

# new line on shift+enter
map shift+enter send_text all \x1b[13;2u

# command: kitty +list-fonts --psnames | grep -i monaspace
# BEGIN_KITTY_FONTS
font_family      family='Monaspace Argon NF' style=Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
