# Serve only the Croatian eID card (Certilia middleware) on p11-kit's default
# socket, which Chrome reaches through /usr/lib/pkcs11/p11-kit-client.so.
# The Certilia library crashes its host process when the card is removed, so it
# runs here instead of inside Chrome. Installed by `./bootstrap.sh croatian_eid`.
[Service]
ExecStart=
ExecStart=/usr/bin/p11-kit server -f -n %t/p11-kit/pkcs11 --provider /opt/certiliamiddleware/pkcs11/libCertiliaPkcs11.so pkcs11:
